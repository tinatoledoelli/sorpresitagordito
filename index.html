<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La misión de la sorpresa ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#7d285f,transparent 35%),radial-gradient(circle at 90% 90%,#6c214c,transparent 40%),linear-gradient(135deg,#180d25,#35132e);display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;bottom:-50px;animation:up linear infinite;opacity:0}
@keyframes up{15%{opacity:.8}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.app{width:min(780px,100%);position:relative;z-index:2;background:#180d25c9;border:1px solid #ffffff2e;border-radius:28px;padding:22px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(12px)}
header{text-align:center}.tag{font-size:.75rem;letter-spacing:1.5px;color:#ffc6dd;border:1px solid #ff79ad;padding:6px 12px;border-radius:99px}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:15px 0 5px}.sub{color:#f4bdd3;margin-top:0}
.stats{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}
.stat{background:#ffffff10;border:1px solid #ffffff24;border-radius:13px;padding:9px 13px}
#barbox{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-bottom:22px}#bar{height:100%;width:0;background:linear-gradient(90deg,#ff4f91,#ffc3d9);transition:.4s}
.card{background:#ffffff0e;border:1px solid #ffffff28;border-radius:22px;padding:23px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
h2{margin:0 0 10px}.question{color:#ffe2ed;line-height:1.55;font-size:1.05rem}
button,input{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,#ff4f91,#d92f75);font-weight:800;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.options{display:grid;gap:10px;margin-top:18px}.options button{text-align:left;background:#ffffff0e;border:1px solid #ffffff25}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff35;background:#130b1c;color:#fff;outline:none;margin:15px 0}input:focus{border-color:#ff79ad}
.feedback{min-height:25px;margin-top:13px;color:#ffc7da;font-weight:700}
.center{text-align:center}.big{font-size:5rem;display:inline-block;animation:heart 1.1s infinite;filter:drop-shadow(0 0 15px #ff4f91)}
@keyframes heart{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(1)}}
.meter{height:18px;border-radius:99px;background:#ffffff14;overflow:hidden;margin:15px 0}.meter i{display:block;height:100%;width:0;background:#ff5b9a;transition:.2s}
.reaction{font-size:3.5rem;min-height:70px;display:grid;place-items:center}
.sequence{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.sym{width:58px;height:58px;border-radius:15px;background:#ffffff14;border:1px solid #ffffff28;display:grid;place-items:center;font-size:2rem}
.scramble{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0}.letter{font-size:1.6rem;font-weight:900;background:#ffffff12;border:1px solid #ffffff28;padding:10px 13px;border-radius:12px}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.hole{aspect-ratio:1;border-radius:50%;background:#120a1a;border:2px solid #ffffff18;display:grid;place-items:center;font-size:2rem}
footer{text-align:center;color:#bc91aa;font-size:.78rem;margin-top:15px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@media(max-width:520px){.app{padding:16px}.card{padding:17px}}
</style>
</head>
<body>
<div id="bg"></div>
<main class="app">
<header>
<span class="tag">MISIÓN SECRETA ❤️</span>
<h1>¿Querés tu sorpresa?</h1>
<p class="sub">Demostrá que merecés desbloquearla 😈</p>
</header>
<div class="stats">
<div class="stat">Prueba <b id="n">1</b>/7</div>
<div class="stat">Vidas <span id="lives">❤️❤️❤️</span></div>
<div class="stat">Tiempo <b id="time">—</b></div>
</div>
<div id="barbox"><div id="bar"></div></div>
<section id="game" class="card"></section>
<footer>Advertencia: el novio puede ser descansado si pierde 😂</footer>
</main>

<script>
const game=document.getElementById("game"), nEl=document.getElementById("n"), livesEl=document.getElementById("lives"), timeEl=document.getElementById("time"), bar=document.getElementById("bar");
let level=0,lives=3,timer=null,locked=false,score=0,answerExpected="",reactionTimeout=null;

const challenges=[
 {type:"choice",title:"🔥 Reto 1 · ¿Cuánto me conocés?",q:"¿Qué vale más para conseguir la sorpresa?",opts:["A) Tener suerte","B) Conocerme bien","C) Pagarme","D) Hacer trampa"],correct:1,ok:"Empezamos bien. Por ahora no te devuelvo a tu casa 😌"},
 {type:"code",title:"🔐 Reto 2 · Código secreto",q:"Descifrá <b>SPSQSFTB</b>. Cada letra del mensaje original fue desplazada <b>una posición hacia adelante</b> en el abecedario. ¿Qué palabra aparece al volver una posición atrás?",input:true,answer:"sorpresa",ok:"¡DESCIFRASTE LA SORPRESA! 🕵️‍♂️"},
 {type:"reaction",title:"⚡ Reto 3 · Reflejos",q:"Cuando aparezca ❤️, hacé clic en el botón. Si aparece 😈, NO TOQUES NADA.",reaction:true},
 {type:"sequence",title:"🧠 Reto 4 · Memoria express",q:"Memorizá los símbolos. Desaparecen en 4 segundos.",sequence:true},
 {type:"choice",title:"🍫 Reto 5 · El dilema",q:"Tenés una última porción de chocolate y yo te digo «es mía». ¿Qué hacés?",opts:["A) Me la como escondido","B) Te la doy y pido un beso","C) La tiro","D) La vendo"],correct:1,ok:"Respuesta aprobada. El chocolate puede continuar con vida."},
 {type:"scramble",title:"🔤 Reto 6 · Palabra desordenada",q:"Ordená las letras para formar algo que seguramente querés recibir:",letters:["S","O","R","P","R","E","S","A"],input:true,answer:"sorpresa",ok:"¡SÍ! Ya casi llegás al premio."},
 {type:"final",title:"👑 RETO FINAL · La pregunta imposible",q:"Elegí con cuidado. Esta respuesta decide tu destino:",opts:["A) Yo siempre tengo razón ❤️","B) Vos siempre tenés razón","C) Los dos tenemos razón","D) No quiero problemas"],correct:0,ok:"Respuesta diplomática y estratégicamente correcta. 😂❤️"}
];

function bg(){
 const b=document.getElementById("bg");
 for(let i=0;i<32;i++){let e=document.createElement("span");e.className="float";e.textContent=["♥","♡","✦","✨","💋"][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+"%";e.style.fontSize=12+Math.random()*25+"px";e.style.animationDuration=7+Math.random()*9+"s";e.style.animationDelay=-(Math.random()*14)+"s";b.appendChild(e)}
}
function update(){nEl.textContent=Math.min(level+1,7);livesEl.textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);bar.style.width=(level/7*100)+"%"}
function stop(){clearInterval(timer);timer=null;timeEl.textContent="—"}
function start(sec,cb){stop();let s=sec;timeEl.textContent=s+"s";timer=setInterval(()=>{s--;timeEl.textContent=s+"s";if(s<=0){stop();cb()}},1000)}
function fail(msg){if(locked)return;locked=true;stop();lives--;update();game.classList.remove("shake");void game.offsetWidth;game.classList.add("shake");if(lives<=0){lose();return}game.querySelector(".feedback").textContent=msg+" Te queda(n) "+lives+" vida(s).";setTimeout(()=>{locked=false;render()},1000)}
function winChallenge(msg){stop();locked=true;game.innerHTML=`<div class="center"><div class="big">💖</div><h2>¡Superado!</h2><p class="question">${msg}</p><button onclick="next()">Siguiente →</button></div>`}
function choice(i){let c=challenges[level];if(i===c.correct)winChallenge(c.ok);else fail("NOOO 😈 ¡Esa no era!")}
function checkCode(){let v=document.getElementById("inp").value.trim().toLowerCase();if(v===answerExpected)winChallenge(challenges[level].ok);else fail("Código incorrecto 🕵️")}
function checkScramble(){let v=document.getElementById("inp").value.trim().toLowerCase().replace(/\s/g,"");if(v===answerExpected)winChallenge(challenges[level].ok);else fail("Esa palabra quedó más desordenada que tu cabeza 😂")}
function render(){
 stop();locked=false;update();let c=challenges[level],h=`<h2>${c.title}</h2><p class="question">${c.q}</p>`;
 if(c.opts)h+=`<div class="options">${c.opts.map((x,i)=>`<button onclick="choice(${i})">${x}</button>`).join("")}</div>`;
 if(c.type==="code"){answerExpected=c.answer;h+=`<input id="inp" placeholder="Escribí la palabra…"><button onclick="checkCode()">Descifrar 🔓</button>`}
 if(c.type==="scramble"){answerExpected=c.answer;h+=`<div class="scramble">${c.letters.map(x=>`<span class="letter">${x}</span>`).join("")}</div><input id="inp" placeholder="¿Qué palabra es?"><button onclick="checkScramble()">Comprobar 🔎</button>`}
 if(c.type==="reaction")h+=`<div class="reaction" id="reaction">⏳</div><button id="reactBtn" onclick="react()">¡TOCAR!</button>`;
 if(c.type==="sequence")h+=`<div id="seq"></div>`;
 h+=`<div class="feedback"></div>`;game.innerHTML=h;
 if(c.type==="choice"||c.type==="final")start(25,()=>fail("Se terminó el tiempo ⏰"));
 if(c.type==="code"||c.type==="scramble")start(35,()=>fail("Se terminó el tiempo ⏰"));
 if(c.type==="reaction")initReaction();
 if(c.type==="sequence")initSequence();
}
function initReaction(){
 let good=Math.random()>.35;const r=document.getElementById("reaction");r.textContent="👀";setTimeout(()=>{r.textContent=good?"❤️":"😈";r.dataset.good=good;},1200+Math.random()*1800);start(7,()=>fail("¡Demasiado lento! ⚡"))
}
function react(){const r=document.getElementById("reaction");if(r.textContent==="❤️"&&r.dataset.good==="true")winChallenge("¡Reflejos de ninja enamorado! ⚡❤️");else if(r.textContent==="😈")fail("¡CAÍSTE EN LA TRAMPA! 😈");else fail("¡Muy apurado! Todavía no había aparecido nada 😂")}
function initSequence(){
 const sy=["❤️","⭐","🌙","💋","🍓","💎"],seq=Array.from({length:6},()=>sy[Math.floor(Math.random()*sy.length)]),area=document.getElementById("seq");
 area.innerHTML=`<div class="sequence">${seq.map(x=>`<div class="sym">${x}</div>`).join("")}</div><p class="center" id="hint">Memorizá…</p>`;
 setTimeout(()=>{area.innerHTML=`<input id="inp" placeholder="Escribí los 6 símbolos juntos"><button onclick="checkSeq()">Comprobar 🧠</button>`;area.dataset.a=seq.join("");},4000);
 start(25,()=>fail("Se terminó el tiempo ⏰"));
}
function checkSeq(){let v=document.getElementById("inp").value.trim();if(v===document.getElementById("seq").dataset.a)winChallenge("¡Memoria perfecta! 🧠💘");else fail("No era esa secuencia 😵")}
function next(){level++;if(level>=challenges.length){victory();return}render()}
function lose(){stop();bar.style.width=(level/7*100)+"%";game.innerHTML=`<div class="center"><div class="big">💀</div><h2>PERDISTE 😂</h2><p class="question">La sorpresa queda bloqueada. Te faltó cerebro, reflejos o suerte… probablemente las tres.</p><p>Pero te doy otra oportunidad porque soy buena 😌</p><button onclick="restart()">Intentar otra vez 🔁</button></div>`}
function victory(){stop();bar.style.width="100%";game.innerHTML=`<div class="center"><div class="big">💖</div><div style="font-size:3.5rem">🥳💋</div><h2>¡¡¡GANASTE!!!</h2><p class="question" style="font-size:1.3rem"><b>Cuando te vea te doy la sorpresa. ❤️</b></p><p>Pasaste todos los desafíos. Ahora no te hagas el misterioso 😏</p><button onclick="restart()">Jugar de nuevo 🔁</button></div>`}
function restart(){level=0;lives=3;score=0;render()}
bg();render();
</script>
</body>
</html>
